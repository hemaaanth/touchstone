<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Touchstone — security findings you can check</title>
  <desc id="desc">A dark touchstone and its assay streak accompany a path from scope through investigation and evidence to a proof gate.</desc>
  <rect width="1280" height="430" rx="24" fill="#111212"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="64" y="112" fill="#f2f1eb" font-size="53" font-weight="500" letter-spacing="-1.8">Investigate the lead.</text>
    <text x="64" y="178" fill="#f2f1eb" font-size="53" font-weight="500" letter-spacing="-1.8">Verify the finding.</text>
    <text x="67" y="230" fill="#a4a6a1" font-size="21">NEAR AI agents. Scoped tools. Reproducible evidence.</text>
    <path d="M68 319H808" stroke="#424540" stroke-width="1"/>
    <g fill="#111212" stroke="#81857c" stroke-width="1.5">
      <circle cx="69" cy="319" r="5"/><circle cx="292" cy="319" r="5"/>
      <circle cx="556" cy="319" r="5"/><circle cx="807" cy="319" r="5"/>
    </g>
    <g fill="#c4c7bf" font-size="16">
      <text x="64" y="357">Scope</text><text x="263" y="357">Agent fleet</text>
      <text x="522" y="357">Evidence</text><text x="772" y="357">Proof gate</text>
    </g>
    <g transform="translate(914 100) scale(8.5)" fill="#d8dacf">
      <path fill-rule="evenodd" d="M2.8 17.6c-.5-5.6 3.4-10.2 10-11.4 6.8-1.2 14 .6 15.9 6.2 1.9 5.8-1.6 11.4-8.6 13-7.8 1.8-16.6-.8-17.3-7.8zM7.6 19.9c-.6-1.5.3-2.9 2-3.3l14.6-3.5c1-.2 1.5 1.1.6 1.6L10.7 21.4c-1.2.6-2.6.1-3.1-1.5z"/>
    </g>
  </g>
</svg>
