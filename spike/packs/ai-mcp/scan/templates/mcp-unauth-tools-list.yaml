id: touchstone-mcp-unauth-tools-list
info:
  name: MCP server lists its tools without sign-in
  author: touchstone
  severity: high
  description: A JSON-RPC tools/list call with no Authorization header returns a tool list.
  tags: mcp,exposure,auth
http:
  - method: POST
    path:
      - "{{BaseURL}}/mcp"
      - "{{BaseURL}}/"
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '"tools"\s*:\s*\['
    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '"name"\s*:\s*"([a-zA-Z0-9_.-]+)"'
