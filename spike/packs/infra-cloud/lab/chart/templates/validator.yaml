apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-validator
spec:
  selector:
    matchLabels:
      app: helm-validator
  template:
    metadata:
      labels:
        app: helm-validator
    spec:
      hostNetwork: true
      containers:
        - name: validator
          image: {{ .Values.image | quote }}
          securityContext:
            privileged: true
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: helm-validator
spec:
  type: {{ .Values.serviceType }}
  selector:
    app: helm-validator
  ports:
    - port: 9000
      targetPort: 9000
